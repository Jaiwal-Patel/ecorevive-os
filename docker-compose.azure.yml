x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    init: true
    env_file:
      - .env.azure
    command:
      - sh
      - -c
      - >
        exec redis-server
        --appendonly yes
        --requirepass "$${REDIS_PASSWORD}"
        --maxmemory "$${REDIS_MAXMEMORY:-128mb}"
        --maxmemory-policy "$${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >
          redis-cli
          -a "$${REDIS_PASSWORD}"
          ping
          | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    mem_limit: 160m
    pids_limit: 100
    logging: *default-logging

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file:
      - .env.azure
    command:
      - ./production-entrypoint.sh
    volumes:
      - /var/lib/ecorevive/media:/app/media
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl -fsS
          -H "Host: $${ECOREVIVE_DOMAIN}"
          -H "X-Forwarded-Proto: https"
          http://127.0.0.1:8000/admin/login/
          >/dev/null
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    mem_limit: 384m
    pids_limit: 150
    logging: *default-logging

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file:
      - .env.azure
    command:
      - sh
      - -c
      - >
        exec celery
        -A ecorevive
        worker
        --loglevel=INFO
        --concurrency="$${CELERY_CONCURRENCY:-1}"
    volumes:
      - /var/lib/ecorevive/media:/app/media
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    stop_grace_period: 30s
    mem_limit: 256m
    pids_limit: 150
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 96m
    pids_limit: 100
    logging: *default-logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    init: true
    env_file:
      - .env.azure
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/caddy/Caddyfile.azure:/etc/caddy/Caddyfile:ro
      - /var/lib/ecorevive/media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: 96m
    pids_limit: 100
    logging: *default-logging

volumes:
  redis_data:
  caddy_data:
  caddy_config:
